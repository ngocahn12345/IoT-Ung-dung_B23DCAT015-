$kind: http-request
description: Bật quạt thông gió (LED 2 trên chân GPIO 6)
url: "{{base_url}}/api/control"
method: POST
headers:
  x-api-key: "{{api_key}}"
body:
  type: urlencoded
  content:
    device: "{{quat}}"
    action: ON
scripts:
  - type: afterResponse
    code: |-
      pm.test("Gửi lệnh ON cho Bật quạt (LED 2) thành công (200)", function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test("Phản hồi success: true", function () {
          pm.expect(json.success).to.be.true;
      });
    language: text/javascript
order: 3000
